<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="en">

<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
    </f:facet>
    <title><ui:insert name="title">PrimeFaces Manhattan</ui:insert></title>
    <h:outputScript name="js/layout.js" library="manhattan-layout"/>
    <h:outputScript name="js/prism.js" library="manhattan-layout"/>
    <ui:insert name="head"/>
    <h:outputStylesheet>
        <![CDATA[
            html, body {
                background-color: #1e1e1e !important;
                color: #e0e0e0 !important;
            }
            .layout-wrapper, .layout-main, .layout-content, .layout-sidebar, .layout-topbar {
                background-color: #1e1e1e !important;
            }
            .ui-datatable, .ui-datatable thead th, .ui-datatable tbody td {
                background-color: #2b2b2b !important;
                color: #e0e0e0 !important;
                border-color: #444 !important;
            }
            .ui-datatable tbody tr:hover td {
                background-color: #3a3a3a !important;
            }
            .ui-datatable tbody tr.ui-state-highlight td {
                background-color: #0288d1 !important;
                color: #ffffff !important;
            }
            .ui-panel, .ui-panel-content, .ui-panel-titlebar,
            .ui-dialog, .ui-dialog-content, .ui-dialog-titlebar {
                background-color: #2b2b2b !important;
                color: #e0e0e0 !important;
                border-color: #444 !important;
            }
            .ui-inputtext, .ui-inputtextarea, .ui-password input {
                background-color: #3c3c3c !important;
                color: #e0e0e0 !important;
                border-color: #555 !important;
            }
            .ui-outputlabel, label {
                color: #cccccc !important;
            }
            .ui-paginator {
                background-color: #2b2b2b !important;
                color: #e0e0e0 !important;
            }
        ]]>
    </h:outputStylesheet>
</h:head>

<h:body>
    <div class="layout-wrapper layout-slim layout-dark">
        <div class="layout-main">
            <ui:include src="./topbar.xhtml"/>

            <div class="layout-content">
                <ui:insert name="content"/>
            </div>

            <ui:include src="./footer.xhtml"/>

            <div class="layout-main-mask"></div>
        </div>

        <ui:include src="./config.xhtml"/>
        <ui:include src="./rightpanel.xhtml"/>
        <ui:include src="./sidebar.xhtml"/>
    </div>

    <p:ajaxStatus style="width:32px;height:32px;position:fixed;right:7px;bottom:7px">
        <f:facet name="start">
            <i class="pi pi-spin pi-spinner layout-ajax-loader-icon" aria-hidden="true"/>
        </f:facet>

        <f:facet name="complete">
            <h:outputText value=""/>
        </f:facet>
    </p:ajaxStatus>

    <h:outputStylesheet name="dark-theme.css"/>
    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/layout-blue-grey.css" library="manhattan-layout" />
</h:body>

</html>
