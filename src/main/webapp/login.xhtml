<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="/WEB-INF/template.xhtml">

    

    

    

    <ui:define name="head">
        <style>
            html, body {
                background-color: #2b2b2b !important;
                background-image: url('http://localhost:8080/biblioteca.jpg') !important;
                background-size: cover !important;
                background-position: center !important;
                background-attachment: fixed !important;
                color: #ffffff !important;
            }
            .layout-wrapper, .layout-main, .layout-content, .layout-topbar {
                background-color: transparent !important;
                background: transparent !important;
            }
            .ui-panel, .ui-panel-content, .ui-panel-titlebar {
                background-color: rgba(40, 40, 40, 0.85) !important;
                color: #ffffff !important;
                border-color: #555 !important;
            }
            .ui-outputlabel {
                color: #cccccc !important;
            }
        </style>
    </ui:define>

    <ui:define name="title">
        Login - Biblioteca
    </ui:define>

    <ui:define name="content">
        <h:form id="frmLogin">

            <p:growl id="growl" showDetail="true"/>

            <div style="display:flex; justify-content:center; margin-top:80px;">
                <p:panel header="Biblioteca - Acesso ao Sistema"
                         style="width:420px;">

                    <h:panelGrid columns="2" cellpadding="8"
                                 style="width:100%;">

                        <p:outputLabel for="email" value="E-mail:"/>
                        <p:inputText id="email"
                                     value="#{loginController.usuario.email}"
                                     required="true"
                                     requiredMessage="E-mail obrigatório"
                                     style="width:220px;"/>

                        <p:outputLabel for="senha" value="Senha:"/>
                        <p:password id="senha"
                                    value="#{loginController.usuario.senha}"
                                    required="true"
                                    requiredMessage="Senha obrigatória"
                                    style="width:220px;"/>

                    </h:panelGrid>

                    <br/>

                    <p:commandButton value="Entrar"
                                     action="#{loginController.validarLogin()}"
                                     ajax="false"
                                     icon="pi pi-sign-in"
                                     style="width:100%;"/>

                </p:panel>
            </div>

        </h:form>
    </ui:define>

</ui:composition>
