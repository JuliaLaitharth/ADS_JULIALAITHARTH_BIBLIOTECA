<ui:composition xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://java.sun.com/jsf/html"
  xmlns:f="http://java.sun.com/jsf/core"
  xmlns:p="http://primefaces.org/ui"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  template="/WEB-INF/template.xhtml">

  <ui:define name="title">Livros - Biblioteca</ui:define>

  <ui:define name="content">
    <h:form id="frmList">
      <p:growl id="growl" showDetail="true"/>

   
      <p:dataTable id="tblLivros"
        value="#{livroController.livroList}" var="item"
        paginator="true" rows="10"
        selection="#{livroController.selected}" selectionMode="single"
        rowKey="#{item.id}"
        filteredValue="#{livroController.filteredList}">

        <f:facet name="header">
          <p:commandButton id="btnNovo" value="Novo Livro"
            icon="pi pi-plus" oncomplete="PF('dlgCriar').show()"/>
          <p:commandButton id="btnEditar" value="Editar"
            icon="pi pi-pencil" oncomplete="PF('dlgEditar').show()"
            disabled="#{livroController.selected == null}"/>
          <p:commandButton id="btnExcluir" value="Excluir"
            icon="pi pi-trash"
            oncomplete="PF('dlgConfirmar').show()"
            disabled="#{livroController.selected == null}"/>
          <p:commandButton id="btnDetalhe" value="Detalhes"
            icon="pi pi-info-circle" oncomplete="PF('dlgDetalhe').show()"
            disabled="#{livroController.selected == null}"/>
        </f:facet>

        <p:ajax event="rowSelect" update="btnEditar btnExcluir btnDetalhe"/>
        <p:ajax event="rowUnselect" update="btnEditar btnExcluir btnDetalhe"/>

        <p:column headerText="ID" sortBy="#{item.id}" filterBy="#{item.id}">
          <h:outputText value="#{item.id}"/>
        </p:column>
        <p:column headerText="Título" sortBy="#{item.titulo}" filterBy="#{item.titulo}">
          <h:outputText value="#{item.titulo}"/>
        </p:column>
        <p:column headerText="ISBN" sortBy="#{item.isbn}">
          <h:outputText value="#{item.isbn}"/>
        </p:column>
        <p:column headerText="Ano" sortBy="#{item.anopublicacao}">
          <h:outputText value="#{item.anopublicacao}"/>
        </p:column>
        <p:column headerText="Exemplares">
          <h:outputText value="#{item.exemplares}"/>
        </p:column>
      </p:dataTable>
    </h:form>

    <p:dialog id="dlgCriarId" header="Novo Livro" widgetVar="dlgCriar" modal="true">
      <h:form id="frmCriar">
        <p:growl id="growlCriar" showDetail="true"/>
        <h:panelGrid columns="2" cellpadding="5">
          <p:outputLabel for="titulo" value="Título *"/>
          <p:inputText id="titulo" value="#{livroController.livro.titulo}"
            required="true" requiredMessage="Título obrigatório"/>

          <p:outputLabel for="isbn" value="ISBN *"/>
          <p:inputText id="isbn" value="#{livroController.livro.isbn}"
            required="true"/>

          <p:outputLabel for="ano" value="Ano Publicação"/>
          <p:inputNumber id="ano" value="#{livroController.livro.anopublicacao}"
            minValue="1000" maxValue="2100"/>

          <p:outputLabel for="exemplares" value="Exemplares"/>
          <p:inputNumber id="exemplares" value="#{livroController.livro.exemplares}"
            minValue="1"/>

          <p:selectManyMenu id="autores"
                  value="#{livroController.livro.autores}">
             <f:selectItems value="#{livroController.autorList}"
                   var="a"
                   itemLabel="#{a.nome}"
                   itemValue="#{a}"/>
           </p:selectManyMenu>

          <p:outputLabel for="resumo" value="Resumo"/>
          <p:inputTextarea id="resumo" value="#{livroController.livro.resumo}"
            rows="4" cols="40"/>
        </h:panelGrid>
        <p:commandButton value="Salvar"
          action="#{livroController.adicionarLivro()}"
          update="frmList growlCriar" oncomplete="PF('dlgCriar').hide()"
          icon="pi pi-save"/>
        <p:commandButton value="Cancelar" type="button"
          onclick="PF('dlgCriar').hide()" icon="pi pi-times"/>
      </h:form>
    </p:dialog>

    <p:dialog id="dlgEditarId" header="Editar Livro" widgetVar="dlgEditar" modal="true">
      <h:form id="frmEditar">
        <h:panelGrid columns="2" cellpadding="5">
          <p:outputLabel for="tituloE" value="Título *"/>
          <p:inputText id="tituloE" value="#{livroController.selected.titulo}"
            required="true"/>
          <p:outputLabel for="isbnE" value="ISBN *"/>
          <p:inputText id="isbnE" value="#{livroController.selected.isbn}"/>
          <p:outputLabel for="anoE" value="Ano"/>
          <p:inputNumber id="anoE" value="#{livroController.selected.anopublicacao}"/>
          <p:outputLabel for="exemplaresE" value="Exemplares"/>
          <p:inputNumber id="exemplaresE" value="#{livroController.selected.exemplares}"/>
          <p:outputLabel for="resumoE" value="Resumo"/>
          <p:inputTextarea id="resumoE" value="#{livroController.selected.resumo}"
            rows="4" cols="40"/>
        </h:panelGrid>
        <p:commandButton value="Salvar" action="#{livroController.editarLivro()}"
          update="frmList" oncomplete="PF('dlgEditar').hide()" icon="pi pi-save"/>
        <p:commandButton value="Cancelar" type="button"
          onclick="PF('dlgEditar').hide()" icon="pi pi-times"/>
      </h:form>
    </p:dialog>

    <p:confirmDialog id="dlgConfirmarId" message="Confirmar exclusão?"
      header="Atenção" severity="warn" widgetVar="dlgConfirmar">
      <h:form>
        <p:commandButton value="Sim, Excluir"
          action="#{livroController.deletarLivro()}"
          update="frmList" oncomplete="PF('dlgConfirmar').hide()"
          icon="pi pi-trash" styleClass="ui-button-danger"/>
        <p:commandButton value="Cancelar" type="button"
          onclick="PF('dlgConfirmar').hide()" icon="pi pi-times"/>
      </h:form>
    </p:confirmDialog>

    <p:dialog id="dlgDetalheId" header="Detalhes do Livro"
      widgetVar="dlgDetalhe" modal="true">
      <h:panelGrid columns="2" cellpadding="5">
        <h:outputText value="Título:"/>
        <h:outputText value="#{livroController.selected.titulo}"/>
        <h:outputText value="ISBN:"/>
        <h:outputText value="#{livroController.selected.isbn}"/>
        <h:outputText value="Ano:"/>
        <h:outputText value="#{livroController.selected.anopublicacao}"/>
        <h:outputText value="Exemplares:"/>
        <h:outputText value="#{livroController.selected.exemplares}"/>
        <h:outputText value="Resumo:"/>
        <h:outputText value="#{livroController.selected.resumo}"/>
      </h:panelGrid>
    </p:dialog>

  </ui:define>
</ui:composition>
