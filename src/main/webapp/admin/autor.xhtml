<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">Autores - Biblioteca</ui:define>

    <ui:define name="content">
        <h:form id="frmList">
            <p:growl id="growl" showDetail="true"/>
            <p:dataTable id="tblAutores"
                         value="#{autorController.autorList}"
                         var="item"
                         paginator="true" rows="10"
                         selection="#{autorController.selected}"
                         selectionMode="single"
                         rowKey="#{item.id}">
                <f:facet name="header">
                    <p:commandButton id="btnNovo" value="Novo Autor"
                                     icon="pi pi-plus" type="button"
                                     onclick="PF('dlgCriar').show()"/>
                    <p:commandButton id="btnEditar" value="Editar"
                                     icon="pi pi-pencil"
                                     oncomplete="PF('dlgEditar').show()"
                                     update="frmEditar"
                                     disabled="#{autorController.selected == null}"/>
                    <p:commandButton id="btnExcluir" value="Excluir"
                                     icon="pi pi-trash"
                                     oncomplete="PF('dlgConfirmar').show()"
                                     disabled="#{autorController.selected == null}"/>
                    <p:commandButton id="btnDetalhe" value="Detalhes"
                                     icon="pi pi-info-circle"
                                     oncomplete="PF('dlgDetalhe').show()"
                                     update="frmDetalhe"
                                     disabled="#{autorController.selected == null}"/>
                </f:facet>
                <p:ajax event="rowSelect"   update="frmList"/>
                <p:ajax event="rowUnselect" update="frmList"/>
                <p:column headerText="ID" style="width:60px;">
                    <h:outputText value="#{item.id}"/>
                </p:column>
                <p:column headerText="Nome" sortBy="#{item.nome}" filterBy="#{item.nome}">
                    <h:outputText value="#{item.nome}"/>
                </p:column>
                <p:column headerText="E-mail" sortBy="#{item.email}" filterBy="#{item.email}">
                    <h:outputText value="#{item.email}"/>
                </p:column>
                <p:column headerText="Nacionalidade" sortBy="#{item.nacionalidade}">
                    <h:outputText value="#{item.nacionalidade}"/>
                </p:column>
            </p:dataTable>
        </h:form>

        <p:dialog id="dlgCriarId" header="Novo Autor"
                  widgetVar="dlgCriar" modal="true" resizable="false">
            <h:form id="frmCriar">
                <p:growl id="growlCriar" showDetail="true"/>
                <h:panelGrid columns="2" cellpadding="8">
                    <p:outputLabel for="nome" value="Nome *"/>
                    <p:inputText id="nome"
                                 value="#{autorController.autor.nome}"
                                 required="true"
                                 requiredMessage="Nome obrigatório"
                                 style="width:250px;"/>
                    <p:outputLabel for="email" value="E-mail *"/>
                    <p:inputText id="email"
                                 value="#{autorController.autor.email}"
                                 required="true"
                                 requiredMessage="E-mail obrigatório"
                                 style="width:250px;"/>
                    <p:outputLabel for="dtnascimento" value="Data Nascimento"/>
                    <p:datePicker id="dtnascimento"
                                  value="#{autorController.autor.dtnascimento}"
                                  pattern="dd/MM/yyyy"
                                  style="width:250px;"/>
                    <p:outputLabel for="nacionalidade" value="Nacionalidade"/>
                    <p:inputText id="nacionalidade"
                                 value="#{autorController.autor.nacionalidade}"
                                 style="width:250px;"/>
                </h:panelGrid>
                <p:commandButton value="Salvar"
                                 action="#{autorController.adicionarAutor()}"
                                 update="frmList growlCriar"
                                 oncomplete="if(!args.validationFailed) PF('dlgCriar').hide();"
                                 icon="pi pi-save"/>
                <p:commandButton value="Cancelar" type="button"
                                 onclick="PF('dlgCriar').hide()"
                                 icon="pi pi-times"
                                 styleClass="ui-button-secondary"/>
            </h:form>
        </p:dialog>

        <p:dialog id="dlgEditarId" header="Editar Autor"
                  widgetVar="dlgEditar" modal="true" resizable="false">
            <h:form id="frmEditar">
                <p:growl id="growlEditar" showDetail="true"/>
                <h:panelGrid columns="2" cellpadding="8">
                    <p:outputLabel for="nomeE" value="Nome *"/>
                    <p:inputText id="nomeE"
                                 value="#{autorController.selected.nome}"
                                 required="true" style="width:250px;"/>
                    <p:outputLabel for="emailE" value="E-mail *"/>
                    <p:inputText id="emailE"
                                 value="#{autorController.selected.email}"
                                 required="true" style="width:250px;"/>
                    <p:outputLabel for="dtnascimentoE" value="Data Nascimento"/>
                    <p:datePicker id="dtnascimentoE"
                                  value="#{autorController.selected.dtnascimento}"
                                  pattern="dd/MM/yyyy"
                                  style="width:250px;"/>
                    <p:outputLabel for="nacionalidadeE" value="Nacionalidade"/>
                    <p:inputText id="nacionalidadeE"
                                 value="#{autorController.selected.nacionalidade}"
                                 style="width:250px;"/>
                </h:panelGrid>
                <p:commandButton value="Salvar"
                                 action="#{autorController.editarAutor()}"
                                 update="frmList growlEditar"
                                 oncomplete="if(!args.validationFailed) PF('dlgEditar').hide();"
                                 icon="pi pi-save"/>
                <p:commandButton value="Cancelar" type="button"
                                 onclick="PF('dlgEditar').hide()"
                                 icon="pi pi-times"
                                 styleClass="ui-button-secondary"/>
            </h:form>
        </p:dialog>

        <p:confirmDialog id="dlgConfirmarId"
                         message="Deseja realmente excluir o autor selecionado?"
                         header="Confirmar Exclusão"
                         severity="warn" widgetVar="dlgConfirmar">
            <h:form>
                <p:commandButton value="Sim, Excluir"
                                 action="#{autorController.deletarAutor()}"
                                 update="frmList"
                                 oncomplete="PF('dlgConfirmar').hide()"
                                 icon="pi pi-trash"
                                 styleClass="ui-button-danger"/>
                <p:commandButton value="Cancelar" type="button"
                                 onclick="PF('dlgConfirmar').hide()"
                                 icon="pi pi-times"
                                 styleClass="ui-button-secondary"/>
            </h:form>
        </p:confirmDialog>

        <p:dialog id="dlgDetalheId" header="Detalhes do Autor"
                  widgetVar="dlgDetalhe" modal="true" resizable="false">
            <h:form id="frmDetalhe">
                <h:panelGrid columns="2" cellpadding="8">
                    <h:outputText value="Nome:"/>
                    <h:outputText value="#{autorController.selected.nome}"
                                  style="font-weight:bold;"/>
                    <h:outputText value="E-mail:"/>
                    <h:outputText value="#{autorController.selected.email}"/>
                    <h:outputText value="Data Nascimento:"/>
                    <h:outputText value="#{autorController.selected.dtnascimento}"/>
                    <h:outputText value="Nacionalidade:"/>
                    <h:outputText value="#{autorController.selected.nacionalidade}"/>
                </h:panelGrid>
                <p:commandButton value="Fechar" type="button"
                                 onclick="PF('dlgDetalhe').hide()"
                                 icon="pi pi-times"
                                 styleClass="ui-button-secondary"/>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
